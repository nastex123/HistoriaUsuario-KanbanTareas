<!doctype html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Login | Riwiflow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col">
  <main class="flex-grow flex items-center justify-center px-gutter py-xxl">
    <div class="w-full max-w-[440px] space-y-xl">
      <div class="text-center space-y-md">
        <h1 id="auth-title" class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Riwiflow</h1>
        <p id="auth-desc" class="font-body-md text-body-md text-on-surface-variant">Sign in to your professional workspace</p>
      </div>
      <div class="bg-surface-container-lowest border border-outline-variant p-xl rounded-xl space-y-lg">
        <form class="space-y-lg" id="loginForm">
          <div id="nameFieldGroup" class="space-y-sm hidden">
            <label class="font-label-md text-label-md text-on-surface" for="name">Full Name</label>
            <input class="w-full px-md py-md bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface input-focus-ring" id="name" name="name" placeholder="John Doe" type="text" />
          </div>
          <div id="roleFieldGroup" class="space-y-sm hidden">
            <label class="font-label-md text-label-md text-on-surface" for="role">Role</label>
            <select id="role" class="w-full px-md py-md bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface input-focus-ring">
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="space-y-sm">
            <label class="font-label-md text-label-md text-on-surface" for="email">Email address</label>
            <input class="w-full px-md py-md bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface input-focus-ring" id="email" name="email" placeholder="name@company.com" required type="email" />
          </div>
          <div class="space-y-sm">
            <div class="flex justify-between items-center">
              <label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
              <a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot password?</a>
            </div>
            <input class="w-full px-md py-md bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface input-focus-ring" id="password" name="password" placeholder="••••••••" required type="password" />
          </div>
          <div class="pt-sm">
            <button id="submitBtn" class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-md px-lg rounded-lg transition-all active:scale-[0.98] flex items-center justify-center gap-sm" type="submit">
              <span id="submitBtnText">Login</span>
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
          </div>
          <div id="error-message" class="text-error text-body-sm text-center hidden"></div>
        </form>
        <div class="relative py-sm">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
          <div class="relative flex justify-center text-label-sm"><span class="bg-surface-container-lowest px-md text-outline font-label-sm uppercase tracking-widest">or continue with</span></div>
        </div>
        <div class="grid grid-cols-1 gap-md">
          <button class="w-full flex items-center justify-center gap-md py-md border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
            <img alt="Google" class="w-4 h-4 opacity-80" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC4MKWoYfBIsxFaqncSN9YxR9mdXQGZNMC1EJDT5yAh5A5R7NXO24MRfA2bF0BxpLFdOJLIlAof80HOr4HokeP6RalmMOUP2rfQdl3XiQ4NoHX37q7XV75Y8mHyjT-0PziGdPkI9qXCMmNzMVVN-ZQUdWwMo6nYIE9qAI22sos0F8nFKx2zlwN1HYzEky_3nI6UP8FAT6bwNH0p2-0Yi3teyjDUPvFHOJwCiAgh-b14qx97Qfr8mlseGFe9mamhHBn8i9WZVkS0Zdjc" />
            Sign in with Google
          </button>
        </div>
      </div>
      <div class="text-center">
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          <span id="toggleText">Don't have an account?</span>
          <a id="toggleMode" class="text-primary font-label-md hover:underline" href="#">Create an account</a>
        </p>
      </div>
    </div>
  </main>
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed/20 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[30%] h-[30%] bg-primary-fixed/10 blur-[100px] rounded-full"></div>
  </div>

  <script src="js/login.js" type="module"></script>
</body>
</html>
